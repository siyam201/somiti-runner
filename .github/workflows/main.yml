name: Cloud Branch Protection Gateway

on:
  repository_dispatch:
    types: [block_private_push]

jobs:
  block-direct-push:
    # এটি চলবে তোমার হাগিং ফেসের সচল রানারে
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Execute Remote Protection
        run: |
          echo "🛑 [ACCESS DENIED] Direct push to '${{ github.event.client_payload.branch }}' branch is blocked on 'somiti' Private Repository!"
          echo "💡 Powered by NoveMixs Cloud Runner Strategy via Hugging Face."
          exit 1
