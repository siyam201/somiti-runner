name: Cloud Protection & Scheduled Ping Gateway

on:
  repository_dispatch:
    types: [block_private_push]
  schedule:
    # এটি গিটহাবকে বলবে প্রতি ৫ মিনিট পর পর নিজে থেকে এই রানারকে ট্রিগার করতে
    - cron: '*/5 * * * *'
  push:
    branches:
      - main

jobs:
  block-direct-push:
    if: github.event_name == 'repository_dispatch'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Execute Remote Protection
        run: |
          echo "🛑 [ACCESS DENIED] Direct push is blocked!"
          exit 1

  scheduled-ping-service:
    # এই জবটি শিডিউল অথবা ম্যানুয়াল পুশের সময় রান হবে
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Run Diagnostics Ping
        run: |
          echo "🚀 Triggering official ping for novemixs.qzz.io..."
          echo "📅 Execution Time: $(date)"
          
          # একবার জাস্ট ৪টি পিং প্যাকেজ পাঠিয়ে প্রসেসটি সাকসেসফুলি ক্লোজ হবে
          ping -c 4 novemixs.qzz.io || curl -sI https://novemixs.qzz.io | head -n 1
          
          echo "✅ Job completed successfully. No long-running freeze."
